
name: Flashscore Live Matches Test

on:
  workflow_dispatch:

jobs:
  scraper-check:
    runs-on: ubuntu-latest

    steps:
      - name: Download scraper
        run: git clone --depth 1 https://github.com/omkarcloud/flashscore-scraper.git

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: python -m pip install -r flashscore-scraper/requirements.txt

      - name: Start scraper and show first match
        run: |
          cd flashscore-scraper
          nohup python run.py > ../scraper.log 2>&1 &

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              echo "Serwer działa!"
              break
            fi
            sleep 2
          done

          echo "=== PIERWSZY MECZ ==="
          curl --max-time 90 -fsS "http://127.0.0.1:8000/matches/live?sport=football" | python -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(d.get('matches',[d])[0], indent=2, ensure_ascii=False))"
