
name: Flashscore Goal Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: flashscore-goal-alerts
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Flashscore scraper
        run: git clone --depth 1 https://github.com/omkarcloud/flashscore-scraper.git

      - name: Install requirements
        run: |
          python -m pip install -r flashscore-scraper/requirements.txt
          python -m pip install -r requirements.txt

      - name: Start Flashscore scraper
        run: |
          cd flashscore-scraper
          nohup python run.py > ../scraper.log 2>&1 &
          cd ..
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              echo "Scraper działa!"
              exit 0
            fi
            sleep 2
          done
          echo "Scraper nie uruchomił się poprawnie."
          cat scraper.log
          exit 1

      - name: Run goal alert bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Save alert history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update goal alert history"
            git push
          else
            echo "Brak zmian w historii alertów."
          fi
